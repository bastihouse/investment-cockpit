name: Kostenlose Marktdaten aktualisieren
on:
  push:
    branches: [main]
    paths: [index.html, insights.js, research.js, dashboard.js, reconstruction.js, workspace.js, research_next.js, experience.js, responsive-preview.html, evaluation.py, monitor_reports.py, reconstruct.py, update_data.py, scoring.py, validation.py, archive.py, requirements.txt, "data/**", "tests/**", ".github/workflows/update.yml"]
  schedule:
    - cron: '35 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-data-pages
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kostenlose Datenbibliothek installieren
        run: python -m pip install -r requirements.txt
      - name: Berechnungen testen
        run: |
          python -m unittest discover -s tests -v
          node tests/test_research.cjs
          node tests/test_history.cjs
          node tests/test_insights.cjs
          node tests/test_workspace.cjs
          node tests/test_research_next.cjs
          node tests/test_experience.cjs
          node --check experience.js
          node --check research_next.js
          node --check workspace.js
          node --check insights.js
          node --check research.js
          node --check dashboard.js
          node --check reconstruction.js
          node tests/test_reconstruction.cjs
      - name: Marktdaten abrufen
        run: |
          python update_data.py
          python reconstruct.py
          python monitor_reports.py
          python evaluation.py
      - name: Änderungen sichern
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update market data'
            git push
          fi
      - name: Website vorbereiten
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for asset in insights research dashboard reconstruction workspace research_next experience; do
            asset_hash=$(sha256sum "$asset.js" | cut -c1-12)
            cp "$asset.js" "_site/$asset.js"
            cp "$asset.js" "_site/$asset.$asset_hash.js"
            sed -i "s|src=\"$asset.js\"|src=\"$asset.$asset_hash.js\"|" _site/index.html
          done
          cp -r data _site/data
          cp responsive-preview.html _site/responsive-preview.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
