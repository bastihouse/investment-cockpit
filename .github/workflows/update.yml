name: Kostenlose Marktdaten aktualisieren
on:
  push:
    branches: [main]
    paths: [index.html, research.js, dashboard.js, reconstruction.js, reconstruct.py, update_data.py, scoring.py, validation.py, archive.py, requirements.txt, "data/**", "tests/**", ".github/workflows/update.yml"]
  schedule:
    - cron: '35 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-data-pages
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kostenlose Datenbibliothek installieren
        run: python -m pip install -r requirements.txt
      - name: Berechnungen testen
        run: |
          python -m unittest discover -s tests -v
          node tests/test_research.cjs
          node tests/test_history.cjs
          node --check research.js
          node --check dashboard.js
          node --check reconstruction.js
          node tests/test_reconstruction.cjs
      - name: Marktdaten abrufen
        run: |
          python update_data.py
          python reconstruct.py
      - name: Änderungen sichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update market data'
            git push
          fi
      - name: Website vorbereiten
        run: |
          mkdir -p _site
          cp index.html research.js dashboard.js reconstruction.js _site/
          asset_hash=$(sha256sum research.js | cut -c1-12)
          cp research.js "_site/research.$asset_hash.js"
          dashboard_hash=$(sha256sum dashboard.js | cut -c1-12)
          cp dashboard.js "_site/dashboard.$dashboard_hash.js"
          sed -e 's|src="research.js"|src="research.'"$asset_hash"'.js"|' -e 's|src="dashboard.js"|src="dashboard.'"$dashboard_hash"'.js"|' index.html > _site/index.html
          reconstruction_hash=$(sha256sum reconstruction.js | cut -c1-12)
          cp reconstruction.js "_site/reconstruction.$reconstruction_hash.js"
          sed -i 's|src="reconstruction.js"|src="reconstruction.'"$reconstruction_hash"'.js"|' _site/index.html
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
