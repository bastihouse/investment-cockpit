name: Kostenlose Marktdaten aktualisieren
on:
  push:
    branches: [main]
    paths: [index.html, research.js, update_data.py, scoring.py, requirements.txt, "data/**", "tests/**", ".github/workflows/update.yml"]
  schedule:
    - cron: '35 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-data-pages
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kostenlose Datenbibliothek installieren
        run: python -m pip install -r requirements.txt
      - name: Berechnungen testen
        run: |
          python -m unittest discover -s tests -v
          node tests/test_research.cjs
          node --check research.js
      - name: Marktdaten abrufen
        run: python update_data.py
      - name: Änderungen sichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update market data'
            git push
          fi
      - name: Website vorbereiten
        run: |
          mkdir -p _site
          cp index.html research.js _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
